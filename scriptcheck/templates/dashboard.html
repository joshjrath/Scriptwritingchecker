      format: function (d) {
        var abbr = tzAbbr(d, TZ);
        if (!abbr) return baseDateFmt.format(d);
        return baseDateFmt.formatToParts(d).map(function (part) {
          return part.type === "timeZoneName" ? abbr : part.value;
        }).join("");
      }
    };
    timeFmt = makeFmt({ month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }, true);
    dayFmt = makeFmt({ month: "short", day: "numeric" }, true);
    dayLongFmt = makeFmt({ weekday: "short", month: "short", day: "numeric" }, true);
    dayKeyFmt = makeFmt({ year: "numeric", month: "2-digit", day: "2-digit" }, true);
    weekdayFmt = makeFmt({ weekday: "short" }, true);
  }
  buildFormatters();
  /* A publish slate is a calendar date, not a moment: render it in UTC so it
     does not slip a day when the display timezone is behind. */
  slateFmt = new Intl.DateTimeFormat("en-US", { timeZone: "UTC", month: "short", day: "numeric" });
  var slateLongFmt = new Intl.DateTimeFormat("en-US",
    { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });

  /* How many days off the posting date is. The slate is a bare calendar date
     pinned to midnight UTC, while "today" depends on the zone the viewer
     picked - so both sides are reduced to a Y-M-D string before subtracting,
     rather than differencing two instants that mean different things. */
  function utcFromKey(key) {
    return Date.UTC(+key.slice(0, 4), +key.slice(5, 7) - 1, +key.slice(8, 10));
  }

  /* Days between a Y-M-D key and the viewer's today. Whole days only, so the
     answer never depends on the time of day on either side. */
  function dayDiff(key, now) {
    if (!key) return null;
    return Math.round((utcFromKey(key) - utcFromKey(dayKey(now))) / DAY);
  }

  function daysUntilSlate(iso, now) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d)) return null;
    return dayDiff(d.toISOString().slice(0, 10), now);
  }

  function slateWhen(days) {
    if (days === null) return "";
    if (days < -1) return Math.abs(days) + " days ago";
    if (days === -1) return "yesterday";
    if (days === 0) return "today";
    if (days === 1) return "tomorrow";
    if (days <= 13) return "in " + days + " days";
    return "";
  }

  function slateClass(days) {
    if (days === null) return "";
    if (days < 0) return " past";
    return days <= 2 ? " soon" : "";
  }

  function fmt(iso, formatter) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return (formatter || dateFmt).format(d);
  }

  function span(ms) {
    var s = Math.abs(Math.round(ms / 1000));
    var d = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    var m = Math.floor((s % 3600) / 60);
    if (d) return d + "d " + h + "h";
    if (h) return h + "h " + m + "m";
    return m + "m";
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* Under a day, count down in timecode - the unit the work is actually
     measured in when a script is due tonight. */
  function timecode(ms) {
    var s = Math.max(0, Math.floor(Math.abs(ms) / 1000));
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60);
  }

  function liveStatus(item, now) {
    var s = item.status;
    // These are decided by the server, not by the clock. Recomputing them from
    // the deadline would resurrect a duplicate as a live assignment.
    if (s === "SUBMITTED" || s === "SUBMITTED_LATE" || s === "NOT_MINE" ||
        s === "IGNORED" || s === "DUPLICATE") return s;
    if (!item.deadline) return "NO_DEADLINE";
    var ms = new Date(item.deadline) - now;
    if (isNaN(ms)) return "NO_DEADLINE";
    if (ms < 0) return "OVERDUE";
    if (ms <= DAY) return "DUE_TODAY";
    if (ms <= DUE_SOON_HOURS * 3600e3) return "DUE_SOON";
    return "PENDING";
  }

  function firstSubmission(item) {
    return (item.submissions && item.submissions.length) ? item.submissions[0] : null;
  }

  function countdown(item, now) {
    if (item.live === "SUBMITTED" || item.live === "SUBMITTED_LATE") {
      var sub = firstSubmission(item);
      if (!sub || !item.deadline || !sub.posted_at) return { main: "done", sub: "delivered" };
      var margin = new Date(item.deadline) - new Date(sub.posted_at);
      return { main: span(margin) + (margin >= 0 ? " early" : " late"), sub: "delivered" };
    }
    if (!item.deadline) return { main: "—", sub: "no date in brief" };
    var ms = new Date(item.deadline) - now;
    return ms < 0
      ? { main: span(ms) + " over", sub: "past deadline" }
      : { main: span(ms) + " left", sub: "until deadline" };
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function titleOf(item) { return item.title || item.thread_name; }

  /* A row the parser is not sure about says so, rather than looking as
     confident as one it read cleanly. */
  function reviewBadge(item) {
    if (!item.needs_review) return null;
    var flag = el("span", "pill flag", "check");
    var why = (item.warnings || []).map(function (w) { return w.replace(/^!\s*/, ""); });
    if (item.confidence && item.confidence !== "HIGH") why.unshift("confidence: " + item.confidence.toLowerCase());
    flag.title = why.join("\n") || "Worth a manual look.";
    return flag;
  }

  function linkedTitle(item, tag) {
    var host = el(tag || "span");
    if (item.jump_url) {
      var a = el("a", null, titleOf(item));
      a.href = item.jump_url;
      a.target = "_blank";
      a.rel = "noopener";
      host.appendChild(a);
    } else {
      host.textContent = titleOf(item);
    }
    return host;
  }

  var state = { filter: null, query: "", sort: "urgency", show: "", tab: "board",
                briefGroup: "deadline" };
  var lastCounts = null;    // previous tile tally, so the numbers can roll
  var lastHeroId = null;    // so the hero only animates when it actually changes
  var lastChartKey = null;  // so columns only re-grow when the buckets change

  /* In drop-box mode the delivery happens in a server this board cannot see,
     so there is nothing to detect - you say so here, once, and it sticks. */
  function markedByHand(item) {
    return (item.overridden || []).indexOf("delivered_at") !== -1;
  }

  function markButton(item) {
    if (!DATA.live) return null;
    if (DATA.can_edit === false) return null;   // read-only share link
    var done = item.live === "SUBMITTED" || item.live === "SUBMITTED_LATE";
    if (done && !markedByHand(item)) return null;  // detected on its own

    var undo = done;
    var wrap = el("span");
    var button = el("button", "markbtn" + (undo ? " undo" : ""), undo ? "undo" : "mark delivered");
    button.type = "button";
    wrap.appendChild(button);

    function fail(message) {
      button.disabled = false;
      button.textContent = undo ? "undo" : "mark delivered";
      button.classList.add("failed");
      var note = el("span", "markerr", message);
      wrap.appendChild(note);
    }

    button.addEventListener("click", function () {
      button.disabled = true;
      button.classList.remove("failed");
      var stale = wrap.querySelector(".markerr");
      if (stale) stale.remove();
      button.textContent = undo ? "undoing" : "saving";

      var response;
      fetch("mark", {
        method: "POST",
        credentials: "same-origin",
        cache: "no-store",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ thread_id: item.thread_id, undo: undo })
      })
        .then(function (r) {
          response = r;
          return r.text();
        })
        .then(function (text) {
          var body = {};
          try { body = JSON.parse(text); } catch (err) { /* not JSON */ }
          if (!response.ok) {
            // Show the status too: 404 here means the session lost its token,
            // which is a different problem from a failed write.
            throw new Error(
              (body.error || text || "no response") + " (HTTP " + response.status + ")"
            );
          }
          if (body.board) {
            applyBoard(body.board);
          } else {
            refresh();
          }
        })
        .catch(function (err) {
          fail(String(err && err.message ? err.message : err));
        });
    });
    return wrap;
  }

  function decorate(now) {
    ITEMS.forEach(function (item) { item.live = liveStatus(item, now); });
  }

  function counts() {
    var out = {};
    TILES.forEach(function (k) { out[k] = 0; });
    active().forEach(function (item) {
      if (item.live === "SUBMITTED" || item.live === "SUBMITTED_LATE") out.DELIVERED++;
      else if (out[item.live] !== undefined) out[item.live]++;
    });
    return out;
  }

  function tileLabel(key) { return key === "DELIVERED" ? "Delivered" : META[key].label; }
  function tileTone(key) { return key === "DELIVERED" ? "var(--ok)" : META[key].tone; }

  /* ---------- hero ---------- */

  function nextUp(now) {
    var open = ITEMS.filter(function (i) {
      return i.deadline && URGENT.concat(["PENDING"]).indexOf(i.live) !== -1;
    });
    if (!open.length) return null;
    var overdue = open.filter(function (i) { return i.live === "OVERDUE"; });
    var pool = overdue.length ? overdue : open;
    pool.sort(function (a, b) { return new Date(a.deadline) - new Date(b.deadline); });
    return pool[0];
  }

  var heroItem = null;

  function renderHero(now) {
    var host = document.getElementById("hero");
    host.textContent = "";
    heroItem = nextUp(now);

    if (!heroItem) {
      host.classList.remove("urgent", "swap");
      lastHeroId = null;
      host.classList.add("calm");
      host.style.setProperty("--tone", "var(--ok)");
      var grid = el("div", "hero-grid");
      var left = el("div");
      left.appendChild(el("p", "eyebrow", "All clear"));
      left.appendChild(el("h2", null, "Nothing is waiting on you."));
      var note = el("p", "hero-meta");
      note.appendChild(el("span", null, "Every brief with a readable deadline has a Drive link in its thread."));
      left.appendChild(note);
      grid.appendChild(left);
      host.appendChild(grid);
      return;
    }

    var over = heroItem.live === "OVERDUE";
    host.classList.remove("calm");
    host.style.setProperty("--tone", META[heroItem.live].tone);

    // The rule along the top of the panel is the only thing that moves up
    // here: the countdown itself has to stay readable while it ticks.
    var urgent = over || heroItem.live === "DUE_TODAY";
    host.classList.toggle("urgent", urgent && !REDUCED);
    if (urgent) syncPhase(host, "--phase-shimmer", CYCLE.shimmer);

    // Only when a different script takes the top slot, not on every rebuild.
    host.classList.toggle("swap", !REDUCED && heroItem.thread_id !== lastHeroId);
    lastHeroId = heroItem.thread_id;

    var grid = el("div", "hero-grid");
    var left = el("div");
    left.appendChild(el("p", "eyebrow", over ? "Most overdue" : "Next deadline"));
    left.appendChild(linkedTitle(heroItem, "h2"));

    var meta = metaRow(heroItem, now);
    meta.classList.add("hero-meta");
    left.appendChild(meta);

    var right = el("div");
    right.appendChild(el("span", "timecode-label", over ? "Overdue by" : "Time remaining"));
    var clock = el("div", "timecode");
    clock.id = "hero-clock";
    right.appendChild(clock);

    grid.appendChild(left);
    grid.appendChild(right);
    host.appendChild(grid);
    tickHero();
  }

  function tickHero() {
    var clock = document.getElementById("hero-clock");
    if (!clock || !heroItem || !heroItem.deadline) return;
    var ms = new Date(heroItem.deadline) - new Date();
    var host = document.getElementById("hero");
    if (Math.abs(ms) < DAY) {
      clock.textContent = timecode(ms);
      host.classList.remove("calm");
    } else {
      clock.textContent = span(ms);
      host.classList.add("calm");
    }
  }

  /* ---------- runway ---------- */

  /* ---------- workload chart ---------- */

  function dayKey(date) {
    // en-CA style parts give a sortable key in the board's own timezone, so a
    // deadline at 11:59 PM belongs to the day it is actually due.
    var parts = {};
    dayKeyFmt.formatToParts(date).forEach(function (p) { parts[p.type] = p.value; });
    return parts.year + "-" + parts.month + "-" + parts.day;
  }

  /* Counts are small integers, so the axis is too: never a "2.5 scripts" tick. */
  function axisTicks(max) {
    var step = max <= 5 ? 1 : Math.ceil(max / 4);
    var ticks = [];
    for (var v = 0; v <= max; v += step) ticks.push(v);
    if (ticks[ticks.length - 1] !== max) ticks.push(max);
    return ticks;
  }

  function plural(n, word) {
    return n + " " + word + (n === 1 ? "" : "s");
  }

  function renderRunway(now) {
    var host = document.getElementById("track");
    var note = document.getElementById("runway-note");
    host.textContent = "";

    var mine = active();
    var open = mine.filter(function (i) {
      return i.live !== "SUBMITTED" && i.live !== "SUBMITTED_LATE" && i.deadline;
    });
    var noDate = mine.filter(function (i) { return !i.deadline && i.live !== "SUBMITTED" && i.live !== "SUBMITTED_LATE"; }).length;

    if (!open.length) {
      note.textContent = noDate ? noDate + " without a deadline" : "";
      host.appendChild(
        el("p", "runway-empty", "Nothing outstanding with a deadline on it.")
      );
      return;
    }

    var words = 0;
    open.forEach(function (i) { words += i.word_count || 0; });
    note.textContent =
      plural(open.length, "script") + " open" +
      (words ? " \u00b7 " + (words >= 1000 ? Math.round(words / 1000) + "k" : words) + " words" : "") +
      (noDate ? " \u00b7 " + noDate + " undated" : "");

    // --- buckets: late, then one per day, then everything further out -------
    // Every column needs room for "Today" under it, with the late and later
    // columns counted in. Any narrower and on a phone the labels ran into
    // each other and the last one was clipped.
    var plotWidth = (host.clientWidth || 640) - 44;   // less the y axis and its gap
    var dayCount = Math.max(4, Math.min(14, Math.floor((plotWidth + 2) / 38) - 2));
    var buckets = [];
    var byKey = {};

    buckets.push({ key: "late", label: "Late", name: "Overdue", late: true, items: [] });
    var cursor = new Date(now);
    for (var d = 0; d < dayCount; d++) {
      var when = new Date(+cursor + d * DAY);
      var key = dayKey(when);
      var full = fmt(when.toISOString(), dayFmt);        // "Sep 21"
      var date = full.replace(/^[A-Za-z]+ /, "");        // "21"
      var weekday = d === 0 ? "Today" : fmt(when.toISOString(), weekdayFmt);
      var bucket = {
        key: key,
        label: weekday,
        // The first of a month carries its month, so a run of 30, 1, 2 does
        // not read as the dates going backwards.
        date: date === "1" ? full : date,
        name: weekday + ", " + full,
        today: d === 0,
        items: []
      };
      byKey[key] = bucket;
      buckets.push(bucket);
    }
    var later = { key: "later", label: "Later", name: "Later", items: [] };

    var lastKey = buckets[buckets.length - 1].key;
    open.forEach(function (item) {
      var when = new Date(item.deadline);
      if (+when < +now) { buckets[0].items.push(item); return; }
      var key = dayKey(when);
      if (byKey[key]) byKey[key].items.push(item);
      else if (key > lastKey) later.items.push(item);
      else buckets[0].items.push(item);
    });
    if (later.items.length) buckets.push(later);
    if (!buckets[0].items.length) buckets.shift();

    buckets.forEach(function (b) { b.total = b.items.length; });

    // Re-grow the columns when the shape of the work changes - a new brief, a
    // delivery, a timezone switch - but not on an idle 60s rebuild.
    var chartKey = buckets.map(function (b) { return b.key + ":" + b.total; }).join("|");
    var chartChanged = chartKey !== lastChartKey;
    lastChartKey = chartKey;

    var max = Math.max(2, Math.max.apply(null, buckets.map(function (b) { return b.total; })));
    var tallest = buckets.reduce(function (a, b) { return b.total > a.total ? b : a; }, buckets[0]);

    // --- axis ---------------------------------------------------------------
    var yAxis = el("div", "chart-y");
    var plotWrap = el("div", "plot-wrap");
    var plot = el("div", "plot");
    if (chartChanged && !REDUCED) plot.classList.add("enter");

    axisTicks(max).forEach(function (value) {
      var f = value / max;
      var line = el("div", "gridline" + (value === 0 ? " base" : ""));
      line.style.bottom = (f * 100) + "%";
      plot.appendChild(line);

      var tick = el("div", "ytick", String(value));
      tick.style.bottom = (f * 100) + "%";
      yAxis.appendChild(tick);
    });

    var tip = el("div", "charttip");
    tip.hidden = true;

    buckets.forEach(function (bucket, index) {
      // Only a day with work on it is a control. An empty day was a nameless
      // button - a tab stop that a screen reader announced as just "button".
      var busy = bucket.items.length > 0;
      var col = el(busy ? "button" : "div", "col" + (busy ? " has-work" : ""));
      if (busy) {
        col.type = "button";
        col.setAttribute("aria-label",
          bucket.name + ": " + plural(bucket.total, "script") + " \u2014 " +
          bucket.items.map(titleOf).join("; "));
      } else {
        col.setAttribute("aria-hidden", "true");
      }
      if (bucket.today) col.classList.add("today");
      var tone = bucket.late ? "var(--critical)" : "var(--accent)";
      col.style.setProperty("--tone", tone);
      col.style.setProperty("--rise", (index * 42) + "ms");
      if (bucket.late && bucket.total) {
        col.classList.add("late");
        syncPhase(col, "--phase-breathe", CYCLE.urgent);
      }

      var stack = el("div", "stack");
      stack.style.height = ((bucket.total / max) * 100) + "%";
      // One equal block per script, so a column can be counted as well as read.
      bucket.items.forEach(function () {
        var seg = el("div", "seg");
        seg.style.height = (100 / bucket.total) + "%";
        stack.appendChild(seg);
      });
      col.appendChild(stack);

      // One direct label, on the busiest column; the axis carries the rest.
      if (bucket === tallest && bucket.total > 0) {
        var cap = el("div", "col-cap", String(bucket.total));
        cap.style.bottom = "calc(" + ((bucket.total / max) * 100) + "% + 4px)";
        col.appendChild(cap);
      }

      if (bucket.items.length) {
        var show = function () {
          tip.textContent = "";
          tip.appendChild(
            el("b", null, bucket.name + " \u00b7 " + plural(bucket.total, "script"))
          );
          var list = el("ul");
          bucket.items.forEach(function (item) {
            var li = el("li");
            li.appendChild(document.createTextNode(titleOf(item)));
            li.appendChild(
              el("span", null,
                item.word_count ? item.word_count.toLocaleString() + "w" : "\u2014")
            );
            list.appendChild(li);
          });
          tip.appendChild(list);
          var box = col.getBoundingClientRect();
          var host_box = host.getBoundingClientRect();
          tip.style.left = (box.left - host_box.left + box.width / 2) + "px";
          tip.style.top = (box.top - host_box.top - 6) + "px";
          tip.hidden = false;
        };
        col.addEventListener("mouseenter", show);
        col.addEventListener("focus", show);
        col.addEventListener("mouseleave", function () { tip.hidden = true; });
        col.addEventListener("blur", function () { tip.hidden = true; });
      }
      plot.appendChild(col);
    });

    plotWrap.appendChild(plot);

    // The columns carry their own names, so the axis is for the eye only.
    var xrow = el("div", "xrow");
    xrow.setAttribute("aria-hidden", "true");
    buckets.forEach(function (bucket) {
      var label = el("div",
        "xlabel" + (bucket.today ? " today" : "") + (bucket.late ? " late" : ""));
      label.appendChild(el("span", "wd", bucket.label));
      if (bucket.date) label.appendChild(el("span", "dd", bucket.date));
      xrow.appendChild(label);
    });
    plotWrap.appendChild(xrow);

    host.appendChild(yAxis);
    host.appendChild(plotWrap);
    host.appendChild(tip);

    // Two classes, so identity never rests on colour alone.
    var legend = el("div", "legend");
    [["var(--critical)", "Overdue"], ["var(--accent)", "Ahead"]].forEach(function (pair) {
      var entry = el("span");
      var swatch = el("i");
      swatch.style.setProperty("--tone", pair[0]);
      entry.appendChild(swatch);
      entry.appendChild(document.createTextNode(pair[1]));
      legend.appendChild(entry);
    });
    plotWrap.appendChild(legend);
  }

  /* ---------- tiles, cards, table ---------- */

  function renderTiles(tally) {
    var host = document.getElementById("tiles");
    host.textContent = "";
    TILES.forEach(function (key, index) {
      var n = tally[key] || 0;
      var btn = el("button", "tile" + (n ? "" : " zero"));
      btn.type = "button";
      btn.style.setProperty("--tone", tileTone(key));
      btn.setAttribute("aria-pressed", state.filter === key ? "true" : "false");

      if (n && (key === "OVERDUE" || key === "DUE_TODAY")) {
        btn.classList.add("pulsing");
        btn.style.setProperty("--breathe", (key === "DUE_TODAY" ? CYCLE.calm : CYCLE.urgent) + "s");
        syncPhase(btn, "--phase-breathe", key === "DUE_TODAY" ? CYCLE.calm : CYCLE.urgent);
      }
      entrance(btn, "tile:" + key, index);

      var value = el("span", "n", String(n));
      // First paint counts up from nothing; later renders roll from whatever
      // was on screen, so a script going overdue is visible as a movement.
      countUp(value, lastCounts ? (lastCounts[key] || 0) : 0, n);
      btn.appendChild(value);
      btn.appendChild(el("span", "k", tileLabel(key)));
      btn.addEventListener("click", function () {
        state.filter = state.filter === key ? null : key;
        render();
        if (state.filter) revealTable();
      });
      host.appendChild(btn);
    });
    lastCounts = tally;
  }

  /* A tile filters the table, and the table is a long way below it - so on
     its own the click changed nothing you could see. Take the reader there,
     and put focus on the matching chip so pressing it again clears it. */
  function revealTable() {
    var target = document.getElementById("everything");
    if (!target) return;
    try {
      target.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
    } catch (err) {
      target.scrollIntoView(true);
    }
    var chip = document.querySelector('#chips .chip[aria-pressed="true"]');
    if (chip) {
      try { chip.focus({ preventScroll: true }); } catch (err) { /* old browser */ }
    }
  }

  /* The show and the slot are one identifier - video numbers restart per
     channel, so VIDEO-001 alone names nothing - and read as one chip. */
  function identChip(item) {
    if (!item.project && !item.slot) return null;
    var chip = el("span", "ident");
    if (item.project) chip.appendChild(el("span", "show", item.project));
    if (item.slot) chip.appendChild(el("span", "slot", item.slot));
    return chip;
  }

  function statusPill(item) {
    var pill = el("span", "pill", META[item.live].label);
    pill.style.setProperty("--tone", META[item.live].tone);
    return pill;
  }

  /* With every assignment in one channel its name is the same words on every
     line; it only says something once there are two to tell apart. */
  var mixedChannels = false;

  function channelsVary() {
    var seen = Object.create(null);
    var n = 0;
    active().forEach(function (i) {
      if (i.channel && !seen[i.channel]) { seen[i.channel] = true; n++; }
    });
    return n > 1;
  }

  function showsAvailable() {
    var seen = Object.create(null);
    var out = [];
    active().forEach(function (i) {
      if (i.project && !seen[i.project]) { seen[i.project] = true; out.push(i.project); }
    });
    return out.sort();
  }

  function renderShowPicker() {
    var picker = document.getElementById("showpick");
    var shows = showsAvailable();
    // With one show the name is already on every row; the control only earns
    // its space once there is something to choose between.
    picker.hidden = shows.length < 2;
    if (picker.hidden) { state.show = ""; return; }

    var wanted = state.show;
    picker.textContent = "";
    var all = el("option", null, "All shows");
    all.value = "";
    picker.appendChild(all);
    shows.forEach(function (name) {
      var option = el("option", null, name);
      option.value = name;
      picker.appendChild(option);
    });
    // A show can disappear between renders (delivered, filtered, re-parsed),
    // so fall back to all rather than filtering to nothing.
    picker.value = shows.indexOf(wanted) === -1 ? "" : wanted;
    state.show = picker.value;
  }

  function matchesShow(item) {
    return !state.show || item.project === state.show;
  }

  function postChip(item, now) {
    if (!item.slate_date) return null;
    var days = daysUntilSlate(item.slate_date, now);
    var chip = el("span", "postdate" + slateClass(days));
    chip.appendChild(el("b", null, "POSTS"));
    var when = slateWhen(days);
    // Spell out the near ones on the chip itself; further out, the date says
    // it and the wording would only make the chip longer.
    chip.appendChild(document.createTextNode(
      fmt(item.slate_date, slateLongFmt) + (when && days <= 2 ? " \u00b7 " + when : "")));
    if (when) chip.title = "Goes out " + when;
    return chip;
  }

  /* The deadline first, since it is the fact this board exists to watch,
     then the length, then the channel when there is more than one. */
  function factsLine(item) {
    var line = el("span", "facts");
    var parts = 0;
    function next() {
      if (parts++) line.appendChild(document.createTextNode(" \u00b7 "));
    }
    if (item.deadline) {
      next();
      line.appendChild(document.createTextNode("due "));
      line.appendChild(el("b", null, fmt(item.deadline)));
    }
    if (item.word_count) {
      next();
      line.appendChild(document.createTextNode(item.word_count.toLocaleString() + " words"));
    }
    if (mixedChannels && item.channel) {
      next();
      line.appendChild(document.createTextNode("#" + item.channel));
    }
    return parts ? line : null;
  }

  /* One order wherever an assignment is summed up - the hero and every card:
     status, what the script is, when it posts, then the facts. */
  function metaRow(item, now) {
    var row = el("div", "meta");
    row.appendChild(statusPill(item));
    var flag = reviewBadge(item);
    if (flag) row.appendChild(flag);
    var ident = identChip(item);
    if (ident) row.appendChild(ident);
    var chip = postChip(item, now || new Date());
    if (chip) row.appendChild(chip);
    var facts = factsLine(item);
    if (facts) row.appendChild(facts);
    // Last, as the one action in a row of facts. The brief panels build their
    // own header, so this does not give a brief a button back to itself.
    var jump = briefLink(item);
    if (jump) row.appendChild(jump);
    return row;
  }

  function renderUrgent(now) {
    var host = document.getElementById("urgent");
    host.textContent = "";
    var urgent = sorted(active().filter(function (i) { return URGENT.indexOf(i.live) !== -1; }));
    document.getElementById("urgent-count").textContent = urgent.length ? String(urgent.length) : "";

    if (!urgent.length) {
      var ok = el("div", "empty glass");
      ok.appendChild(el("strong", null, "Nothing is owed right now."));
      ok.appendChild(el("span", null,
        "No script is overdue or due inside the next " + DUE_SOON_HOURS + " hours."));
      host.appendChild(ok);
      return;
    }

    urgent.forEach(function (item, index) {
      var card = el("article", "card glass");
      card.style.setProperty("--tone", META[item.live].tone);

      // Only the two statuses that are actually owed today get a pulse; due
      // soon and undated sit still, so the motion keeps meaning something.
      if (item.live === "OVERDUE" || item.live === "DUE_TODAY") {
        var gentle = item.live === "DUE_TODAY";
        card.classList.add("pulsing");
        if (gentle) card.classList.add("gentle");
        syncPhase(card, "--phase-breathe", gentle ? CYCLE.calm : CYCLE.urgent);
        if (!gentle) syncPhase(card, "--phase-sweep", CYCLE.sweep);
      }
      entrance(card, item.thread_id + ":" + item.live, index);

      var grid = el("div", "card-grid");
      grid.appendChild(linkedTitle(item, "h3"));

      // "over" and "left" already say which side of the deadline this is, so
      // the countdown stands alone and sits level with the title. The one
      // case that needs words is a brief with no date in it at all.
      var clock = el("div", "clock", item.deadline ? countdown(item, now).main : "no date");
      grid.appendChild(clock);

      grid.appendChild(metaRow(item, now));

      var mark = markButton(item);
      if (mark) {
        var act = el("div", "card-act");
        act.appendChild(mark);
        grid.appendChild(act);
      }
      card.appendChild(grid);

      // The amber rule already says "warning"; a leading "!" on top of it
      // is the parser's shorthand, not something to show a reader.
      (item.warnings || []).forEach(function (w) {
        card.appendChild(el("p", "warn", w.replace(/^!\s*/, "")));
      });
      host.appendChild(card);
    });
  }

  /* What each filter key holds - shared by the filter and the counts on its
     chip, so a chip can never promise a number the table then disagrees with. */
  function inBucket(item, key) {
    if (key === "REVIEW") return !!item.needs_review;
    if (key === "DELIVERED") return isDelivered(item);
    return item.live === key;
  }

  function matchesFilter(item) {
    return !state.filter || inBucket(item, state.filter);
  }

  function matchesQuery(item) {
    if (!state.query) return true;
    return [item.thread_name, item.title, item.project, item.slot, item.channel, item.role]
      .join(" ").toLowerCase().indexOf(state.query) !== -1;
  }

  function sorted(list) {
    var copy = list.slice();
    var far = 8.64e15;
    copy.sort(function (a, b) {
      if (state.sort === "title") return (a.title || "").localeCompare(b.title || "");
      if (state.sort === "show") {
        // Unnamed shows last, then chronological within each show.
        var pa = a.project || "\uffff";
        var pb = b.project || "\uffff";
        if (pa !== pb) return pa.localeCompare(pb);
        return (a.slate_date ? +new Date(a.slate_date) : far) -
               (b.slate_date ? +new Date(b.slate_date) : far);
      }
      if (state.sort === "slate") {
        return (a.slate_date ? +new Date(a.slate_date) : far) - (b.slate_date ? +new Date(b.slate_date) : far);
      }
      var da = a.deadline ? +new Date(a.deadline) : far;
      var db = b.deadline ? +new Date(b.deadline) : far;
      if (state.sort === "deadline") return da - db;
      var ra = META[a.live] ? META[a.live].rank : 9;
      var rb = META[b.live] ? META[b.live].rank : 9;
      return ra - rb || da - db;
    });
    return copy;
  }

  /* The class names the cell's slot in the phone layout, where a row is a
     small grid rather than a line of columns. */
  function cell(row, label, node, cls) {
    var td = el("td", cls || null);
    td.setAttribute("data-label", label);
    td.appendChild(node);
    row.appendChild(td);
  }

  function renderTable(now) {
    var host = document.getElementById("rows");
    host.textContent = "";
    var pool = active();
    var list = sorted(pool.filter(function (i) {
      return matchesFilter(i) && matchesQuery(i) && matchesShow(i);
    }));
    document.getElementById("count").textContent =
      list.length + (list.length === pool.length ? "" : " of " + pool.length);

    if (!list.length) {
      var tr = el("tr", "empty-row");
      var td = el("td", null, "Nothing matches that filter.");
      td.colSpan = 6;
      td.style.color = "var(--muted)";
      tr.appendChild(td);
      host.appendChild(tr);
      return;
    }

    list.forEach(function (item) {
      var tr = el("tr");

      var status = el("span", "t-status");
      status.appendChild(statusPill(item));
      var flag = reviewBadge(item);
      if (flag) status.appendChild(flag);
      cell(tr, "Status", status, "c-status");

      var name = el("div", "t-name");
      // Title and brief button share a row, so the icon pins to the first
      // line rather than wrapping under a short title.
      var titleRow = el("div", "t-title-row");
      titleRow.appendChild(linkedTitle(item, "span"));
      var jump = briefLink(item);
      if (jump) titleRow.appendChild(jump);
      name.appendChild(titleRow);
      var sub = el("span", "t-sub");
      var ident = identChip(item);
      if (ident) sub.appendChild(ident);
      if (mixedChannels && item.channel) sub.appendChild(el("span", "t-chan", "#" + item.channel));
      if (sub.childNodes.length) name.appendChild(sub);
      cell(tr, "Assignment", name, "c-name");

      var days = daysUntilSlate(item.slate_date, now);
      var post = el("div", "t-post" + slateClass(days));
      post.appendChild(document.createTextNode(
        item.slate_date ? fmt(item.slate_date, slateLongFmt) : "—"));
      var when = slateWhen(days);
      if (when) post.appendChild(el("span", null, when));
      cell(tr, "Posts", post, "c-post");

      // The date, then the time left against it - the same two lines the
      // Posts column uses, so both dates in a row read the same way.
      var c = countdown(item, now);
      var due = el("div", "t-due");
      due.appendChild(document.createTextNode(item.deadline ? fmt(item.deadline) : "—"));
      var left = el("span", null, item.deadline || isDelivered(item) ? c.main : c.sub);
      left.style.color = META[item.live].tone;
      due.appendChild(left);
      cell(tr, "Deadline", due, "c-due");

      var words = el("span", "num", item.word_count ? item.word_count.toLocaleString() : "—");
      if (item.word_count) words.appendChild(el("span", "unit", " words"));
      cell(tr, "Words", words, "c-words");

      // A mark button stands in for "not yet": it says the same thing and
      // is the one thing to do about it. Stacking both is what used to
      // push this column past the edge of the panel.
      var delivery = firstSubmission(item);
      var rowMark = markButton(item);
      var deliv = el("div", "t-deliv");
      var delivCls = "c-deliv";
      if (delivery) {
        var url = (delivery.links || [])[0] || "";
        var stamp = fmt(delivery.posted_at, timeFmt);
        var shown;
        if (url && /^https?:/i.test(url)) {
          shown = el("a", "link", stamp || "open");
          shown.href = url;
          shown.target = "_blank";
          shown.rel = "noopener";
        } else {
          shown = el("span", "num", stamp || "yes");
        }
        deliv.appendChild(shown);
        delivCls += " has-delivery";
      } else if (!rowMark) {
        deliv.appendChild(el("span", "dash", "not yet"));
        delivCls += " is-empty";
      }
      if (rowMark) deliv.appendChild(rowMark);
      cell(tr, "Delivered", deliv, delivCls);

      host.appendChild(tr);
    });
  }

  function closeNotifs() {
    var bell = document.getElementById("bell");
    document.getElementById("notifs").hidden = true;
    bell.setAttribute("aria-expanded", "false");
  }

  function renderDuplicates() {
    var bell = document.getElementById("bell");
    var badge = document.getElementById("bell-badge");
    var panel = document.getElementById("notifs");

    var dupes = ITEMS.filter(function (i) { return i.live === "DUPLICATE"; });
    if (!dupes.length) {
      bell.hidden = true;
      closeNotifs();
      return;
    }

    bell.hidden = false;
    badge.textContent = dupes.length > 9 ? "9+" : String(dupes.length);
    bell.setAttribute(
      "aria-label", dupes.length + " brief" + (dupes.length === 1 ? "" : "s") + " forwarded twice"
    );

    panel.textContent = "";
    panel.appendChild(el("h2", null, "Forwarded twice"));
    dupes.forEach(function (item) {
      var clash = (item.warnings || []).some(function (w) {
        return w.indexOf("different deadlines") !== -1;
      });
      var row = el(item.jump_url ? "a" : "div", "notif");
      row.style.setProperty("--tone", clash ? "var(--today)" : "var(--muted)");
      if (item.jump_url) {
        row.href = item.jump_url;
        row.target = "_blank";
        row.rel = "noopener";
      }
      row.appendChild(el("b", null, titleOf(item)));
      row.appendChild(
        el("span", clash ? "clash" : null,
          clash
            ? "Forwarded again with a different deadline \u2014 check which brief is current"
            : "Already tracked; this copy is ignored")
      );
      panel.appendChild(row);
    });
  }

  function renderChips() {
    var host = document.getElementById("chips");
    host.textContent = "";
    var pool = active();
    function tally(key) {
      return pool.filter(function (i) { return inBucket(i, key); }).length;
    }
    function chip(label, n, key) {
      var button = el("button", "chip", label);
      button.type = "button";
      button.appendChild(el("span", "n", String(n)));
      button.setAttribute("aria-pressed", state.filter === key ? "true" : "false");
      button.addEventListener("click", function () {
        state.filter = key === null || state.filter === key ? null : key;
        render();
      });
      host.appendChild(button);
    }

    chip("All", pool.length, null);

    var chipKeys = TILES.slice();
    // Offer these only when there is something in them, so the row stays short
    // on an ordinary day but nothing becomes unreachable.
    ["DUE_SOON", "PENDING", "NO_DEADLINE"].forEach(function (key) {
      if (tally(key)) chipKeys.splice(chipKeys.length - 1, 0, key);
    });
    chipKeys.forEach(function (key) { chip(tileLabel(key), tally(key), key); });

    var flagged = tally("REVIEW");
    if (flagged) chip("Needs check", flagged, "REVIEW");
  }

  /* A short, relevant list: the board's own zone, the viewer's, and the few
     that come up in these briefs. */
  var TZ_CHOICES = [
    "America/Los_Angeles", "America/Denver", "America/Chicago", "America/New_York",
    "Europe/London", "Europe/Berlin", "Asia/Dubai", "Asia/Kolkata",
    "Asia/Singapore", "Asia/Tokyo", "Australia/Sydney", "UTC"
  ];

  function zoneLabel(zone) {
    var city = zone === "UTC" ? "UTC" : zone.split("/").pop().replace(/_/g, " ");
    var now = new Date();
    var abbr = tzAbbr(now, zone);
    if (!abbr) {
      try {
        var parts = new Intl.DateTimeFormat("en-US", {
          timeZone: zone, timeZoneName: "short"
        }).formatToParts(now);
        var found = parts.filter(function (p) { return p.type === "timeZoneName"; })[0];
        abbr = found ? found.value : "";
      } catch (err) { /* unknown zone */ }
    }
    return abbr && abbr !== city ? city + " \u00b7 " + abbr : city;
  }

  function buildTzPicker() {
    var picker = document.getElementById("tzpick");
    var local = "";
    try { local = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (err) {}

    var zones = [];
    [DATA.timezone, local].concat(TZ_CHOICES).forEach(function (zone) {
      if (zone && zones.indexOf(zone) === -1) zones.push(zone);
    });

    picker.textContent = "";
    zones.forEach(function (zone) {
      var option = el("option", null, zoneLabel(zone) +
        (zone === DATA.timezone ? " (board)" : zone === local ? " (yours)" : ""));
      option.value = zone;
      picker.appendChild(option);
    });
    picker.value = zones.indexOf(TZ) === -1 ? DATA.timezone : TZ;
  }

  function renderHeader(now) {
    if (DATA.board_title) {
      document.querySelector("h1").textContent = DATA.board_title;
      try { document.title = DATA.board_title; } catch (err) { /* sandboxed */ }
    }
    if (DATA.logo_url) {
      var old_mark = document.querySelector(".mark");
      var logo = document.createElement("img");
      logo.className = "mark";
      logo.src = DATA.logo_url;
      logo.alt = "";
      // If the URL is wrong or expired, fall back to the drawn mark rather
      // than leaving a broken-image icon in the header.
      logo.onerror = function () {
        if (logo.parentNode) logo.parentNode.replaceChild(old_mark, logo);
      };
      if (old_mark && old_mark.parentNode) {
        old_mark.parentNode.replaceChild(logo, old_mark);
      }
    }

    var roles = (DATA.roles || []).join(" / ") || "SCRIPT";
    document.getElementById("sub-roles").textContent = roles.toLowerCase() + " ·";

    var fresh = document.getElementById("freshness");
    var stamp = DATA.fetched_at || DATA.generated_at;
    if (stamp) {
      var age = now - new Date(stamp);
      // Under a minute, span() says "0m" - true, and reads like a glitch.
      fresh.textContent = age < 60e3 ? "synced just now"
        : age < 90 * 60e3 ? "synced " + span(age) + " ago"
        : "data " + span(age) + " old";
      fresh.classList.toggle("stale", age > DAY);
      fresh.title = "Snapshot taken " + fmt(stamp);
    } else {
      fresh.hidden = true;
    }

    var notice = DATA.banner || "";
    if (DATA.can_edit === false) {
      notice = notice ? notice + " \u00b7 read-only view" : "Read-only view";
    }
    if (notice) {
      var banner = document.getElementById("banner");
      banner.textContent = notice;
      banner.hidden = false;
    }

    // Nodes rather than markup, so the page has no innerHTML assignment at
    // all - it renders brief text it did not write, and that is the rule
    // that keeps it safe.
    var foot = document.getElementById("foot");
    foot.textContent = "";
    foot.appendChild(document.createTextNode("Built from the Discord threads by "));
    foot.appendChild(el("code", null, "scriptcheck"));
    foot.appendChild(document.createTextNode(
      ". A submission counts only when a Drive link is posted in the thread by you. " +
      "Statuses recompute in the browser, so the countdowns stay right between refreshes."));
  }

  /* Same exclusions as the board: a duplicate is a second copy of a brief
     that is already listed, so showing it here only doubles the reading. The
     bell still flags that a re-forward happened. */
  function briefItems() {
    return ITEMS.filter(function (i) {
      return i.brief_text && HIDDEN.indexOf(i.live) === -1;
    }).sort(function (a, b) {
      return (b.assigned_at ? +new Date(b.assigned_at) : 0) -
             (a.assigned_at ? +new Date(a.assigned_at) : 0);
    });
  }

  var SVG_NS = "http://www.w3.org/2000/svg";

  /* Built as nodes rather than markup: nothing on this page uses innerHTML,
     and it renders brief text this board did not write. */
  var ICONS = {
    copy: [
      ["rect", { x: "9", y: "9", width: "11", height: "11", rx: "2.4" }],
      ["path", { d: "M5 15.5V6A1.5 1.5 0 0 1 6.5 4.5H15" }]
    ],
    check: [["path", { d: "M5 12.6l4.6 4.6L19 7.4" }]],
    cross: [["path", { d: "M7 7l10 10M17 7L7 17" }]],
    brief: [
      ["rect", { x: "5", y: "3.5", width: "14", height: "17", rx: "2.4" }],
      ["path", { d: "M8.6 8.5h6.8M8.6 12h6.8M8.6 15.5h4" }]
    ]
  };

  function svgIcon(name) {
    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    ICONS[name].forEach(function (spec) {
      var node = document.createElementNS(SVG_NS, spec[0]);
      Object.keys(spec[1]).forEach(function (key) {
        node.setAttribute(key, spec[1][key]);
      });
      svg.appendChild(node);
    });
    return svg;
  }

  function announce(message) {
    var note = document.getElementById("live-note");
    if (note) note.textContent = message;
  }

  /* navigator.clipboard exists only in a secure context, so a board served
     over plain http - or an older mobile browser - falls back to the
     selection trick. */
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      var area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.top = "-1000px";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, text.length);   // iOS needs the explicit range
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
      document.body.removeChild(area);
      if (ok) resolve(); else reject(new Error("copy blocked"));
    });
  }

  function copyButton(item) {
    var button = el("button", "brief-copy");
    button.type = "button";
    button.title = "Copy brief";
    button.setAttribute("aria-label", "Copy brief");
    button.appendChild(svgIcon("copy"));

    var timer = null;
    function flash(cls, icon, message) {
      button.className = "brief-copy " + cls;
      button.textContent = "";
      button.appendChild(svgIcon(icon));
      button.title = message;
      announce(message);
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () {
        if (!button.isConnected) return;      // a re-render replaced it
        button.className = "brief-copy";
        button.textContent = "";
        button.appendChild(svgIcon("copy"));
        button.title = "Copy brief";
      }, 1600);
    }

    button.addEventListener("click", function () {
      copyText(item.brief_text).then(
        function () { flash("done", "check", "Brief copied"); },
        function () { flash("failed", "cross", "Could not copy - select the text instead"); }
      );
    });
    return button;
  }

  /* Jump from a script to the brief it came from. */
  function openBrief(threadId) {
    setTab("briefs");
    var panel = document.getElementById("brief-" + threadId);
    if (!panel) return;
    // A delivered brief lives inside the collapsed disclosure.
    var details = panel.closest ? panel.closest("details") : null;
    if (details) details.open = true;
    // The tab was hidden a moment ago; let it lay out before scrolling.
    requestAnimationFrame(function () {
      panel.scrollIntoView({ behavior: REDUCED ? "auto" : "smooth", block: "start" });
      panel.classList.add("flash");
      setTimeout(function () { panel.classList.remove("flash"); }, 1700);
    });
  }

  function briefLink(item) {
    // No text means a read-only viewer, who has no briefs tab to jump to.
    if (!item.brief_text) return null;
    var button = el("button", "briefjump");
    button.type = "button";
    button.title = "Open the brief";
    button.setAttribute("aria-label", "Open the brief for " + titleOf(item));
    button.appendChild(svgIcon("brief"));
    button.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      openBrief(item.thread_id);
    });
    return button;
  }

  function isDelivered(item) {
    return item.live === "SUBMITTED" || item.live === "SUBMITTED_LATE";
  }

  function briefPanel(item) {
    var panel = el("article", "brief glass");
    panel.id = "brief-" + item.thread_id;

    var head = el("div", "brief-head");
    var ident = identChip(item);
    if (ident) head.appendChild(ident);
    head.appendChild(linkedTitle(item, "h3"));
    var tools = el("span", "brief-tools");
    tools.appendChild(statusPill(item));
    tools.appendChild(copyButton(item));
    head.appendChild(tools);
    panel.appendChild(head);

    // textContent, so a brief containing markup is shown, never run.
    panel.appendChild(el("pre", "brief-body", item.brief_text));

    var foot = el("div", "brief-foot");
    function note(label, value) {
      if (!value) return;
      var span = el("span");
      span.appendChild(el("b", null, label + " "));
      span.appendChild(document.createTextNode(value));
      foot.appendChild(span);
    }
    note("forwarded", item.assigned_at ? fmt(item.assigned_at, timeFmt) : "");
    // The exact string the deadline was read from: the most error-prone
    // extraction, so it is worth putting next to the text it came from.
    note("read deadline as", item.deadline_raw || "(nothing found)");
    note("read words as", item.word_count ? item.word_count.toLocaleString() : "(nothing found)");

    var mark = markButton(item);
    if (mark) {
      var action = el("span", "brief-action");
      action.appendChild(mark);
      foot.appendChild(action);
    }
    if (foot.childNodes.length) panel.appendChild(foot);

    return panel;
  }

  /* Bucket the briefs under one day each. The two groupings are different
     kinds of date and are ordered accordingly: a posting schedule reads
     forwards like a calendar, an inbox reads newest first. */
  var BRIEF_GROUPS = {
    deadline:  { field: "deadline",    empty: "No deadline",     newestFirst: false },
    slate:     { field: "slate_date",  empty: "No posting date", newestFirst: false },
    forwarded: { field: "assigned_at", empty: "Undated",         newestFirst: true }
  };

  function groupBriefs(items) {
    var mode = state.briefGroup;
    var spec = BRIEF_GROUPS[mode] || BRIEF_GROUPS.deadline;
    var buckets = {};
    var order = [];

    items.forEach(function (item) {
      var date = item[spec.field] ? new Date(item[spec.field]) : null;
      if (date && isNaN(date)) date = null;
      /* A posting date is a bare calendar day already pinned to midnight UTC,
         so it is read back in UTC. A deadline and a forwarding time are real
         instants, so they fall on whichever day they land on in the zone the
         viewer picked - an 11:59 PM ET deadline moves to the next day when
         read from Kolkata, which is correct. */
      var key = !date ? ""
        : mode === "slate" ? date.toISOString().slice(0, 10)
        : dayKey(date);
      if (!buckets[key]) {
        buckets[key] = { key: key, date: date, items: [] };
        order.push(buckets[key]);
      }
      buckets[key].items.push(item);
    });

    order.sort(function (a, b) {
      if (!a.key) return 1;          // undated last, whichever way the rest runs
      if (!b.key) return -1;
      // A schedule of work reads forwards; an inbox reads newest first.
      return spec.newestFirst ? b.key.localeCompare(a.key) : a.key.localeCompare(b.key);
    });
    return { buckets: order, spec: spec, mode: mode };
  }

  function briefDayHead(bucket, grouping, now, isPast) {
    var head = el("div", "brief-day-head");
    var slate = grouping.mode === "slate";

    head.appendChild(el("h2", null, !bucket.date
      ? grouping.spec.empty
      : fmt(bucket.date.toISOString(), slate ? slateLongFmt : dayLongFmt)));

    var days = bucket.key ? dayDiff(bucket.key, now) : null;
    /* A passed deadline is only overdue while something is still owed. In the
       past section the work is delivered, so the same date is simply old -
       calling it overdue there would be flatly wrong. */
    var owed = grouping.mode === "deadline" && !isPast;
    var when = days !== null && days < 0 && owed ? "overdue" : slateWhen(days);
    if (when) head.appendChild(el("span", "rel", when));

    head.appendChild(el("span", "rule"));
    head.appendChild(el("span", "count",
      bucket.items.length + (bucket.items.length === 1 ? " brief" : " briefs")));

    var tone = days === null ? ""
      : days < 0 ? (owed ? " overdue" : " past")
      : days <= 2 ? " soon" : "";
    return { node: head, tone: tone };
  }

  function renderBriefs() {
    var host = document.getElementById("brief-list");
    var button = document.getElementById("tab-briefs-btn");
    var items = briefItems();

    // A read-only viewer is never sent the text, so the tab would be an empty
    // room. Hide it rather than explain it - and the strip with it, since a
    // lone Board tab is a control with nothing to switch to.
    button.hidden = !items.length;
    document.getElementById("tabs").hidden = !items.length;
    if (!items.length) {
      if (state.tab === "briefs") setTab("board");
      host.textContent = "";
      document.getElementById("past-briefs").hidden = true;
      return;
    }

    var now = new Date();
    var open = items.filter(function (i) { return !isDelivered(i); });
    var past = items.filter(isDelivered);

    // The badge counts what is still owed; delivered briefs are tucked away
    // and should not inflate it.
    button.textContent = "Briefs";
    if (open.length) button.appendChild(el("span", "n", String(open.length)));

    host.textContent = "";
    if (open.length) {
      renderBriefDays(host, open, now);
    } else {
      host.appendChild(el("div", "briefs-empty",
        past.length ? "Nothing open - every brief here is delivered."
                    : "No briefs yet."));
    }

    var details = document.getElementById("past-briefs");
    details.hidden = !past.length;
    if (past.length) {
      document.getElementById("past-count").textContent = past.length + " delivered";
      renderBriefDays(document.getElementById("past-list"), past, now, true);
    }
  }

  function renderBriefDays(host, items, now, isPast) {
    host.textContent = "";
    var grouping = groupBriefs(items);
    grouping.buckets.forEach(function (bucket) {
      var head = briefDayHead(bucket, grouping, now, isPast);
      var day = el("div", "brief-day" + head.tone);
      day.appendChild(head.node);
      bucket.items.forEach(function (item) { day.appendChild(briefPanel(item)); });
      host.appendChild(day);
    });
  }

  function setTab(name) {
    state.tab = name;
    [["board", "tab-board"], ["briefs", "tab-briefs"]].forEach(function (pair) {
      var on = pair[0] === name;
      document.getElementById(pair[1]).hidden = !on;
      document.getElementById(pair[1] + "-btn").setAttribute("aria-selected", on ? "true" : "false");
    });
    try {
      // Linkable, and survives a refresh.
      if (history.replaceState) history.replaceState(null, "", name === "briefs" ? "#briefs" : "#");
    } catch (err) { /* file:// or blocked history */ }
  }

  function render() {
    var now = new Date();
    var wasOpen = !document.getElementById("notifs").hidden;
    decorate(now);
    mixedChannels = channelsVary();
    renderHero(now);
    renderRunway(now);
    renderTiles(counts());
    renderDuplicates();
    renderChips();
    renderShowPicker();
    renderBriefs();
    renderUrgent(now);
    renderTable(now);
    if (wasOpen && !document.getElementById("bell").hidden) {
      document.getElementById("notifs").hidden = false;
      document.getElementById("bell").setAttribute("aria-expanded", "true");
    }
  }

  document.getElementById("tzpick").addEventListener("change", function (e) {
    TZ = e.target.value;
    try { window.localStorage.setItem(TZ_KEY, TZ); } catch (err) { /* blocked */ }
    buildFormatters();
    buildTzPicker();
    renderHeader(new Date());
    render();
  });

  document.getElementById("bell").addEventListener("click", function (e) {
    e.stopPropagation();
    var panel = document.getElementById("notifs");
    var open = panel.hidden;
    panel.hidden = !open;
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("notifs").addEventListener("click", function (e) {
    e.stopPropagation();
  });
  document.addEventListener("click", closeNotifs);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeNotifs();
  });

  document.getElementById("search").addEventListener("input", function (e) {
    state.query = e.target.value.trim().toLowerCase();
    renderTable(new Date());
  });
  document.getElementById("briefgroup").addEventListener("change", function (e) {
    state.briefGroup = e.target.value;
    renderBriefs();
  });

  document.getElementById("tab-board-btn").addEventListener("click", function () {
    setTab("board");
  });
  document.getElementById("tab-briefs-btn").addEventListener("click", function () {
    setTab("briefs");
  });

  document.getElementById("showpick").addEventListener("change", function (e) {
    state.show = e.target.value;
    render();
  });

  document.getElementById("sort").addEventListener("change", function (e) {
    state.sort = e.target.value;
    render();
  });

  /* ---------- live updates ---------- */

  function setStatus(cls, text) {
    var fresh = document.getElementById("freshness");
    fresh.hidden = false;
    fresh.className = "freshness " + cls;
    fresh.textContent = "";
    var dot = el("span", "dot");
    syncPhase(dot, "--phase-dot", 2.4);
    fresh.appendChild(dot);
    fresh.appendChild(document.createTextNode(text));
  }

  /* The page is served by the daemon, which pushes a new board whenever
     Discord tells it something changed. Falls back to polling if the stream
     cannot be held open (some proxies buffer SSE). */
  var polling = null;

  function applyBoard(data) {
    if (!data || !data.assignments) return;
    DATA = data;
    ITEMS = data.assignments;
    render();
    setStatus(polling ? "live" : "live", polling ? "updating" : "live");
  }

  function refresh() {
    return fetch("report.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(applyBoard)
      .catch(function () { setStatus("dropped", "offline"); });
  }

  /* Poll when the event stream cannot be held open. Some hosts buffer or
     close SSE connections, and a board that silently stops updating is worse
     than one that updates a few seconds late. */
  function startPolling() {
    if (polling) return;
    polling = setInterval(refresh, 15e3);
    refresh();
  }

  function goLive() {
    var retry = 0;

    if (typeof EventSource === "undefined") {
      startPolling();
      return;
    }

    function connect() {
      var source;
      try {
        source = new EventSource("events");
      } catch (err) {
        startPolling();
        return;
      }
      source.addEventListener("board", function (event) {
        retry = 0;
        if (polling) { clearInterval(polling); polling = null; }
        try { applyBoard(JSON.parse(event.data)); } catch (err) { /* bad frame */ }
      });
      source.onopen = function () { setStatus("live", "live"); };
      source.onerror = function () {
        source.close();
        retry += 1;
        if (retry >= 3) {
          // Three failures is enough: stop pretending and start polling.
          startPolling();
          return;
        }
        setStatus("dropped", "reconnecting");
        setTimeout(connect, 1000 * Math.pow(2, retry));
      };
    }
    connect();
  }

  buildTzPicker();
  renderHeader(new Date());
  render();
  if (window.location.hash === "#briefs" && !document.getElementById("tab-briefs-btn").hidden) {
    setTab("briefs");
  }
  setInterval(tickHero, 1000);
  setInterval(render, 60e3);
  if (DATA.live) goLive();
})();
</script>
