<title>Script Board</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* ---------------------------------------------------------------------
     A technical-drawing treatment: dark paper, a ruled grid showing through,
     hairline boxes instead of floating cards, and one orange that is spent
     only on what is urgent or clickable. Nothing here is decorative for its
     own sake - the rules divide, the orange points.
     --------------------------------------------------------------------- */

  /* The dark board is the design's home; light is the same drawing inverted
     onto paper. Both are defined so the system setting and the explicit
     toggle agree. */
  :root {
    --bg-0: #ecece7;
    --bg-1: #e4e4de;
    --rule: rgba(18, 18, 14, .07);
    --rule-2: rgba(18, 18, 14, .13);

    --panel: #f6f6f3;
    --panel-2: #ecece7;
    --panel-3: #e2e2db;
    --stroke: rgba(18, 18, 14, .16);
    --stroke-2: rgba(18, 18, 14, .32);

    --ink: #14140f;
    --ink-2: #3c3c34;
    --muted: #76766c;

    --critical: #c93400;
    --today: #9a5c00;
    --soon: #6b5c00;
    --unknown: #1b4fc4;
    --ok: #10683f;
    --pending: #57574e;
    --accent: #e84f00;
    --accent-ink: #ffffff;

    /* The chart spends colour on one distinction only, and picks two hues no
       colour vision confuses: the orange of urgency against plain graphite. */
    --chart-late: var(--accent);
    --chart-ahead: #55554c;

    /* Only the strength travels as a token: a --sheen holding var(--tone)
       would resolve --tone against :root, not against the card. */
    --sheen-strength: 14%;

    --font-display: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-0: #08080a;
      --bg-1: #0c0c0f;
      --rule: rgba(255, 255, 255, .055);
      --rule-2: rgba(255, 255, 255, .10);

      --panel: #101013;
      --panel-2: #16161a;
      --panel-3: #1c1c21;
      --stroke: rgba(255, 255, 255, .11);
      --stroke-2: rgba(255, 255, 255, .24);

      --ink: #f3f3ef;
      --ink-2: #c2c2ba;
      --muted: #7d7d75;

      --critical: #ff6a3d;
      --today: #ffab52;
      --soon: #d8c258;
      --unknown: #74acff;
      --ok: #45d6a0;
      --pending: #8e8e86;
      --accent: #ff5b04;
      --accent-ink: #0a0a0b;

      --chart-late: var(--accent);
      --chart-ahead: #8e8e84;

      --sheen-strength: 22%;
    }
  }

  :root[data-theme="dark"] {
    --bg-0: #08080a;
    --bg-1: #0c0c0f;
    --rule: rgba(255, 255, 255, .055);
    --rule-2: rgba(255, 255, 255, .10);

    --panel: #101013;
    --panel-2: #16161a;
    --panel-3: #1c1c21;
    --stroke: rgba(255, 255, 255, .11);
    --stroke-2: rgba(255, 255, 255, .24);

    --ink: #f3f3ef;
    --ink-2: #c2c2ba;
    --muted: #7d7d75;

    --critical: #ff6a3d;
    --today: #ffab52;
    --soon: #d8c258;
    --unknown: #74acff;
    --ok: #45d6a0;
    --pending: #8e8e86;
    --accent: #ff5b04;
    --accent-ink: #0a0a0b;

    --chart-late: var(--accent);
    --chart-ahead: #8e8e84;

    --sheen-strength: 22%;
  }

  body {
    background: var(--bg-0);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  /* ---------- the ruled ground ---------- */
  /* Squared paper, fixed behind everything. The panels sit on it as boxes
     ruled onto the sheet rather than as objects floating above it. */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: var(--bg-0);
    background-image:
      linear-gradient(to right, var(--rule) 1px, transparent 1px),
      linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
    background-size: 104px 104px;
    background-position: -1px -1px;
  }
  .blob { display: none; }
  .b1, .b2, .b3 { display: none; }
  /* A single soft lift behind the top of the page, so a long board does not
     read as one flat field. */
  .grain {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 60% at 50% -10%, var(--bg-1) 0%, transparent 70%);
  }

  /* ---------- boxes ---------- */
  /* Held by their edge, not by a shadow: one hairline, square corners. */
  .glass {
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 0;
    box-shadow: none;
  }

  .wrap {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding-left: 20px;
    padding-right: 20px;
    box-sizing: border-box;
  }

  /* ---------- header ---------- */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 30;
    border-radius: 0;
    border-width: 0 0 1px;
    background: color-mix(in srgb, var(--bg-0) 92%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
    .topbar { background: var(--bg-0); }
  }
  .bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding-block: 14px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  img.mark { background: none; border: 0; box-shadow: none; border-radius: 0; }
  .mark {
    flex: none;
    display: block;
    width: 30px; height: 30px;
    border-radius: 0;
    object-fit: contain;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin: 0;
  }
  .brand > div { min-width: 0; }
  .sub {
    margin: 3px 0 0;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
  }
  @media (max-width: 480px) {
    #sub-roles { display: none; }
    .tzpick { margin-left: 0; }
  }

  .tzpick {
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: transparent;
    border: 0;
    border-radius: 0;
    padding: 1px 15px 1px 4px;
    margin-left: 3px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                      linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 7px top 8px, right 3px top 8px;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  .tzpick:hover { color: var(--accent); }
  .tzpick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; color: var(--ink); }
  .tzpick option { background: var(--panel); color: var(--ink); }
  @media (pointer: coarse) {
    .tzpick {
      padding-top: 7px;
      padding-bottom: 7px;
      background-position: right 7px top 14px, right 3px top 14px;
    }
  }

  .freshness {
    flex: none;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-2);
    background: var(--panel-2);
    border: 1px solid var(--stroke);
    border-radius: 0;
    padding: 6px 11px;
    white-space: nowrap;
  }
  .freshness.stale { color: var(--today); border-color: color-mix(in srgb, var(--today) 50%, transparent); }
  .freshness.live { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .freshness.dropped { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 50%, transparent); }
  .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 0;
    background: currentColor;
    margin-right: 7px;
    vertical-align: middle;
  }
  .freshness.live .dot {
    animation: pulse 2.4s ease-in-out infinite;
    animation-delay: var(--phase-dot, 0s);
  }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .freshness.live .dot { animation: none; } }

  main { padding-block: 26px 70px; display: flex; flex-direction: column; gap: 26px; }

  .banner {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-2);
    padding: 11px 14px;
    margin: 0;
    border-style: solid;
    border-left-width: 3px;
    border-left-color: var(--accent);
    border-radius: 0;
  }

  /* A section label is a marker and a word, the way a drawing is annotated. */
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .eyebrow::before {
    content: "";
    width: 7px; height: 7px;
    flex: none;
    background: var(--accent);
  }

  /* ---------- summary ---------- */
  .summary { position: relative; }
  /* Corner ticks, as on a plate that has been trimmed to a crop mark. */
  .summary::before,
  .summary::after {
    content: "";
    position: absolute;
    width: 9px; height: 9px;
    border: 1px solid var(--accent);
    pointer-events: none;
  }
  .summary::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .summary::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

  .hero { padding: 26px 26px 22px; position: relative; overflow: hidden; }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 2px;
    background: var(--tone, var(--accent));
    opacity: .85;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 20px 30px;
    align-items: center;
  }
  .hero h2 {
    font-family: var(--font-body);
    font-size: clamp(20px, 3.2vw, 29px);
    font-weight: 600;
    line-height: 1.18;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }
  .hero h2 a { color: inherit; text-decoration: none; }
  .hero h2 a:hover { color: var(--accent); }
  .hero-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px 10px;
    margin-top: 15px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }
  .timecode {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(32px, 7vw, 56px);
    line-height: .92;
    letter-spacing: -.03em;
    font-variant-numeric: tabular-nums;
    color: var(--tone, var(--ink));
    text-align: right;
    white-space: nowrap;
  }
  .timecode-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 9px;
    text-align: right;
  }
  .hero.calm .timecode { font-size: clamp(21px, 3.4vw, 28px); }

  /* ---------- counts ---------- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    border-top: 1px solid var(--stroke);
  }
  .tile {
    appearance: none;
    font: inherit;
    text-align: left;
    cursor: pointer;
    background: none;
    border: 0;
    padding: 16px 26px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
    transition: background-color .14s ease;
  }
  .tile + .tile { border-left: 1px solid var(--stroke); }
  .tile::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 2px;
    background: var(--tone, var(--muted));
    opacity: 0;
    transition: opacity .14s ease;
  }
  .tile:hover { background: var(--panel-2); }
  .tile[aria-pressed="true"] { background: var(--panel-2); }
  .tile[aria-pressed="true"]::before { opacity: 1; }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tile .n {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.04em;
    font-variant-numeric: tabular-nums;
    color: var(--tone, var(--ink));
  }
  .tile .k {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tile .k::before {
    content: "";
    width: 5px; height: 5px;
    flex: none;
    background: var(--tone, var(--muted));
  }
  .tile.zero .n { color: var(--muted); opacity: .35; }
  .tile.zero::before { opacity: 0; }
  @media (max-width: 560px) {
    /* Two up, so a wrapped third tile still sits in a ruled cell rather than
       floating free of the grid. */
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 0; }
    .tile { padding: 13px 16px 15px; border-top: 1px solid var(--stroke); }
    .tile + .tile { border-left: 1px solid var(--stroke); }
    .tile:nth-child(odd) { border-left: 0; }
    .tile .n { font-size: 24px; }
    .tile .k { font-size: 9px; letter-spacing: .14em; }
  }

  /* ---------- chart ---------- */
  .runway { padding: 20px 22px 18px; }
  .runway-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .runway-note {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .chart { display: flex; gap: 10px; margin-top: 20px; position: relative; }
  .chart-y { position: relative; width: 30px; flex: none; height: 136px; }
  .ytick {
    position: absolute;
    right: 0;
    transform: translateY(50%);
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
  }
  .plot-wrap { flex: 1; min-width: 0; }
  .plot {
    position: relative;
    height: 136px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
  }
  .gridline {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: var(--rule-2);
  }
  .gridline.base { background: var(--stroke-2); }

  .col {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    background: none;
    border: 0;
    padding: 0;
    font: inherit;
    color: inherit;
    cursor: default;
  }
  .col.has-work { cursor: pointer; }
  .col.today::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--panel-2);
  }
  .stack {
    position: relative;
    width: 100%;
    max-width: 20px;
    display: flex;
    flex-direction: column-reverse;
    gap: 2px;
    justify-content: flex-end;
  }
  .seg {
    background: var(--tone, var(--accent));
    min-height: 3px;
    border-radius: 0;
  }
  .stack .seg:last-child { border-radius: 0; }
  .col:hover .stack { filter: brightness(1.18); }
  .col-cap {
    position: absolute;
    bottom: calc(100% + 1px);
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 500;
    color: var(--ink-2);
    white-space: nowrap;
  }

  .xrow { display: flex; gap: 3px; margin-top: 8px; }
  .xlabel {
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
  }
  .xlabel .dd { display: block; font-size: 9.5px; margin-top: 2px; color: var(--ink-2); }
  .xlabel.today .dd { color: var(--accent); font-weight: 600; }
  .xlabel.late .wd { color: var(--critical); }

  .legend {
    display: flex;
    gap: 16px;
    margin-top: 14px;
    flex-wrap: wrap;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend i { width: 8px; height: 8px; border-radius: 0; background: var(--tone); }

  .charttip {
    position: absolute;
    z-index: 6;
    pointer-events: none;
    transform: translate(-50%, -100%);
    background: var(--panel-2);
    border: 1px solid var(--stroke-2);
    border-radius: 0;
    padding: 9px 11px;
    min-width: 152px;
    max-width: 250px;
  }
  .charttip b {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .charttip ul { margin: 0; padding: 0; list-style: none; }
  .charttip li {
    font-size: 11px;
    line-height: 1.45;
    color: var(--ink-2);
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .charttip li span {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    flex: none;
  }

  .runway-empty {
    font-size: 13px;
    color: var(--muted);
    padding: 24px 0 14px;
    text-align: center;
  }

  /* ---------- cards ---------- */
  .urgent { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--stroke); }
  .card {
    position: relative;
    padding: 16px 20px 16px 23px;
    overflow: hidden;
    border: 1px solid var(--stroke);
    border-top: 0;
    background: var(--panel);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--tone, var(--muted));
  }
  .card-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 18px;
    align-items: start;
  }
  .card h3 {
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    line-height: 1.32;
    text-wrap: balance;
  }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card .meta { grid-column: 1 / -1; }
  .card-act { grid-column: 1 / -1; }
  .clock {
    grid-row: 1;
    grid-column: 2;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    color: var(--tone, var(--ink));
    text-align: right;
    white-space: nowrap;
  }
  @media (max-width: 560px) {
    .card { padding: 14px 15px 14px 18px; }
    .card-grid { grid-template-columns: minmax(0, 1fr); }
    .card-act { margin-top: 2px; }
    .clock { grid-row: auto; grid-column: 1; text-align: left; }
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px 9px;
    margin-top: 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    align-items: center;
  }
  .facts { color: var(--muted); font-size: 11px; letter-spacing: .02em; }
  .facts b { font-weight: 500; color: var(--ink-2); }

  /* The show and the slot are one identifier, so they read as one block. */
  .ident { display: inline-flex; align-items: stretch; }
  .ident > span {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid var(--stroke-2);
    white-space: nowrap;
  }
  .ident .show { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .ident .slot { color: var(--ink-2); background: var(--panel-3); }
  .ident .show + .slot { border-left: 0; }

  .postdate {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-2);
    background: var(--panel-3);
    border: 1px solid var(--stroke);
    border-left: 2px solid var(--stroke-2);
    border-radius: 0;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .postdate b {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .16em;
    color: var(--muted);
  }
  .postdate.soon { color: var(--ink); border-left-color: var(--accent); }
  .postdate.soon b { color: var(--accent); }
  .postdate.past { opacity: .6; }

  .t-due, .t-post {
    font-family: var(--font-mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--ink-2);
  }
  .t-post.soon { color: var(--ink); font-weight: 500; }
  .t-post.past { color: var(--muted); }
  .t-due span, .t-post span {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .06em;
    margin-top: 4px;
  }
  .t-post.soon span { color: var(--accent); }

  .warn {
    margin: 11px 0 0;
    font-size: 13px;
    color: var(--ink-2);
    border-left: 2px solid var(--today);
    padding-left: 11px;
  }
  .empty {
    padding: 34px 20px;
    text-align: center;
    color: var(--muted);
    border-style: dashed;
  }
  .empty strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 5px; font-size: 16px; }

  /* ---------- notifications ---------- */
  .bar-right { display: flex; align-items: center; gap: 10px; }
  .bell-wrap { position: relative; }
  .bell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    padding: 0;
    border-radius: 0;
    background: var(--panel-2);
    border: 1px solid var(--stroke);
    color: var(--ink-2);
    cursor: pointer;
  }
  .bell:hover { color: var(--accent); border-color: var(--stroke-2); }
  .bell svg {
    width: 16px; height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .bell-badge {
    position: absolute;
    top: -6px; right: -6px;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    box-sizing: border-box;
    border-radius: 0;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 600;
    line-height: 15px;
    text-align: center;
  }

  .notifs {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    box-sizing: border-box;
    width: min(340px, calc(100vw - 40px));
    max-height: min(420px, 60vh);
    overflow-y: auto;
    z-index: 40;
    background: var(--panel);
    border: 1px solid var(--stroke-2);
    border-radius: 0;
    padding: 0;
  }
  .notifs h2 {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--stroke);
  }
  .notif {
    display: block;
    width: 100%;
    text-align: left;
    padding: 11px 14px;
    border-radius: 0;
    color: inherit;
    text-decoration: none;
    border-left: 2px solid var(--tone, var(--muted));
    border-bottom: 1px solid var(--stroke);
  }
  .notif:hover { background: var(--panel-2); }
  .notif b { display: block; font-size: 13px; font-weight: 500; line-height: 1.3; color: var(--ink); }
  .notif span {
    display: block;
    margin-top: 4px;
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.4;
    color: var(--muted);
  }
  .notif span.clash { color: var(--today); }
  @media (max-width: 560px) {
    .notifs {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 64px);
      left: 20px;
      right: 20px;
      width: auto;
      max-height: 60vh;
    }
  }

  /* ---------- controls ---------- */
  .tablehead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .tablehead .eyebrow { margin: 0; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="search"], select {
    font: inherit;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: .06em;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--stroke-2);
    border-radius: 0;
    padding: 8px 12px;
  }
  select { padding-right: 10px; text-transform: uppercase; }
  input[type="search"] { min-width: 215px; }
  input[type="search"]::placeholder { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 14px; }
  .chip {
    appearance: none;
    font: inherit;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--panel-2);
    color: var(--muted);
    border: 1px solid var(--stroke);
    border-radius: 0;
    padding: 6px 13px;
    margin: 0 -1px -1px 0;
  }
  .chip[aria-pressed="true"] {
    color: var(--accent-ink);
    background: var(--accent);
    border-color: var(--accent);
    position: relative;
    z-index: 1;
  }
  .chip:hover:not([aria-pressed="true"]) { color: var(--ink); border-color: var(--stroke-2); position: relative; z-index: 1; }
  .chip .n { margin-left: 7px; opacity: .65; }
  .chip[aria-pressed="true"] .n { opacity: .8; }

  #everything { scroll-margin-top: 86px; }

  /* ---------- table ---------- */
  .tablewrap { overflow-x: auto; border-radius: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  thead th {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
    padding: 12px 15px;
    border-bottom: 1px solid var(--stroke-2);
    background: var(--panel-2);
    white-space: nowrap;
  }
  tbody td { padding: 13px 15px; border-bottom: 1px solid var(--stroke); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--panel-2); }
  .t-name { font-weight: 500; line-height: 1.35; }
  /* Title and its brief button share a row, so the icon pins to the first
     line instead of wrapping onto one of its own under a short title. */
  .t-title-row { display: flex; align-items: flex-start; gap: 8px; }
  .t-title-row > span:first-child { flex: 1 1 auto; min-width: 0; }
  .t-title-row .briefjump { margin-left: 0; margin-top: 1px; }
  .t-name a { color: inherit; text-decoration: none; }
  .t-name a:hover { color: var(--accent); }
  .t-sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 7px; }
  .t-sub .ident { flex: none; }
  .t-chan { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); }
  .t-status { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  @media (min-width: 731px) {
    .t-name { max-width: 260px; }
    .t-sub { flex-wrap: nowrap; overflow: hidden; }
  }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
  .unit { display: block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .t-deliv { font-family: var(--font-mono); font-size: 11.5px; }

  .pill {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--tone, var(--muted));
    border: 1px solid color-mix(in srgb, var(--tone, var(--muted)) 55%, transparent);
    background: color-mix(in srgb, var(--tone, var(--muted)) 12%, transparent);
    border-radius: 0;
    padding: 4px 8px;
    white-space: nowrap;
  }
  .markbtn {
    appearance: none;
    font: inherit;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--panel-3);
    color: var(--ink-2);
    border: 1px solid var(--stroke-2);
    border-radius: 0;
    padding: 6px 12px;
    white-space: nowrap;
    transition: border-color .12s ease, color .12s ease, background-color .12s ease;
  }
  .markbtn:hover { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .markbtn.undo:hover { color: var(--accent-ink); background: var(--critical); border-color: var(--critical); }
  .markbtn[disabled] { opacity: .5; cursor: progress; }
  .markbtn.failed { color: var(--critical); border-color: var(--critical); }
  .markerr {
    display: block;
    margin-top: 7px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--critical);
    max-width: 320px;
    white-space: normal;
  }
  .pill.flag { --tone: var(--unknown); cursor: help; }
  .link { color: var(--accent); text-decoration: none; font-family: var(--font-mono); font-size: 11.5px; white-space: nowrap; }
  .link:hover { text-decoration: underline; }
  .dash { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }

  @media (max-width: 730px) {
    .hero-grid { grid-template-columns: minmax(0, 1fr); }
    .timecode, .timecode-label { text-align: left; }
    .tablewrap { overflow-x: visible; background: transparent; border: 0; }
    table, tbody, td { display: block; width: 100%; box-sizing: border-box; }
    thead { display: none; }
    tbody tr {
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-top: 0;
      margin: 0;
      padding: 6px 0;
      display: block;
    }
    tbody tr:first-child { border-top: 1px solid var(--stroke); }
    tbody tr:hover { background: var(--panel-2); }
    tbody tr.empty-row { padding: 16px; }
    tbody td { border-bottom: 0; padding: 5px 15px; }
    td.c-status { padding-top: 12px; }
    td.c-words { display: none; }
    td.c-name { padding-bottom: 8px; }
    td.c-due, td.c-post { display: inline-block; width: auto; padding-right: 22px; }
    td.c-deliv { padding-bottom: 12px; }
    td.c-deliv.is-empty { display: none; }
    td.c-deliv.has-delivery::before {
      content: "delivered ";
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .t-name { font-size: 15px; }
    .t-due, .t-post { white-space: normal; font-size: 12px; }
    .unit { display: inline; }
  }

  footer {
    font-size: 12.5px;
    color: var(--muted);
    padding: 18px 2px 0;
    border-top: 1px solid var(--stroke);
  }
  footer code {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--accent);
    background: none;
    border: 0;
    border-radius: 0;
    padding: 0;
  }

  /* ---------- motion ----------------------------------------------------- */
  /* Three rules this section follows, because the board rebuilds its whole DOM
     every minute:
       1. Entrance animations run once per item, gated in JS - not on every
          re-render, or the page would flinch every 60s.
       2. Looping animations get a negative animation-delay equal to the time
          already elapsed in the cycle, so an element replacing its own
          predecessor picks the loop up mid-stride instead of snapping to 0.
       3. Motion is spent in proportion to urgency: the hero and the overdue
          cards move, the reference table does not. */

  :root {
    --ease-settle: cubic-bezier(.16, 1, .3, 1);
    --ease-travel: cubic-bezier(.45, .05, .25, 1);
  }

  @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } }
  .card.enter,
  .tile.enter {
    animation: rise-in .6s var(--ease-settle) backwards;
    animation-delay: var(--stagger, 0ms);
  }

  @keyframes hero-in { from { opacity: 0; transform: translateY(6px); } }
  .hero.swap .hero-grid { animation: hero-in .55s var(--ease-settle) backwards; }

  @keyframes stack-rise { from { transform: scaleY(0); opacity: .4; } }
  .plot.enter .stack {
    transform-origin: bottom;
    animation: stack-rise .7s var(--ease-settle) backwards;
    animation-delay: var(--rise, 0ms);
  }
  @keyframes cap-in { from { opacity: 0; transform: translateY(4px); } }
  .plot.enter .col-cap {
    animation: cap-in .4s var(--ease-settle) backwards;
    animation-delay: calc(var(--rise, 0ms) + 340ms);
  }

  /* The accent bar carries the urgency: one slow breath, not a blink. */
  @keyframes bar-breathe {
    0%, 100% { opacity: .6; }
    50% { opacity: 1; }
  }
  .card.pulsing { --breathe: 3.2s; }
  .card.pulsing.gentle { --breathe: 4.6s; }
  .card.pulsing::before {
    animation: bar-breathe var(--breathe) ease-in-out infinite;
    animation-delay: var(--phase-breathe, 0s);
  }

  /* Held still for most of the cycle, then crossing quickly: motion with rests
     reads as deliberate, where constant movement reads as a loading state. */
  @keyframes card-sweep {
    0%, 64%  { background-position: -60% 0; }
    100%     { background-position: 260% 0; }
  }
  .card.pulsing:not(.gentle)::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(104deg,
      transparent 40%,
      color-mix(in srgb, var(--tone, var(--accent)) var(--sheen-strength, 18%), transparent) 50%,
      transparent 60%);
    background-size: 180% 100%;
    background-repeat: no-repeat;
    animation: card-sweep 6.4s var(--ease-travel) infinite;
    animation-delay: var(--phase-sweep, 0s);
  }

  @keyframes rule-sweep {
    0%   { background-position: -80% 0; opacity: .55; }
    50%  { opacity: 1; }
    100% { background-position: 180% 0; opacity: .55; }
  }
  .hero.urgent::after {
    background-image: linear-gradient(90deg,
      var(--tone, var(--accent)) 0%,
      color-mix(in srgb, var(--tone, var(--accent)) 35%, white) 50%,
      var(--tone, var(--accent)) 100%);
    background-size: 55% 100%;
    background-repeat: repeat-x;
    animation: rule-sweep 5.2s var(--ease-travel) infinite;
    animation-delay: var(--phase-shimmer, 0s);
  }

  .tile.pulsing::before {
    opacity: 1;
    animation: bar-breathe var(--breathe, 3.2s) ease-in-out infinite;
    animation-delay: var(--phase-breathe, 0s);
  }
  .tile .n { transition: color .3s ease; }

  @keyframes col-breathe {
    0%, 100% { opacity: .8; }
    50%      { opacity: 1; }
  }
  .col.late .stack {
    animation: col-breathe 3.2s ease-in-out infinite;
    animation-delay: var(--phase-breathe, 0s);
  }

  /* Nothing here is load-bearing: every animated property is decoration, so
     switching them all off leaves the board complete. */
  @media (prefers-reduced-motion: reduce) {
    .card.enter, .tile.enter, .hero.swap .hero-grid,
    .plot.enter .stack, .plot.enter .col-cap,
    .card.pulsing::before, .card.pulsing::after,
    .hero.urgent::after, .tile.pulsing::before, .col.late .stack {
      animation: none !important;
    }
    .card.pulsing:not(.gentle)::after { content: none; }
    .past-briefs .chev { transition: none; }
    .brief-copy, .briefjump { transition: none; }
    .brief.flash { animation: none; }
    .tile .n { transition: none; }
  }

  /* ---------- tabs ---------- */
  .tabs { display: inline-flex; gap: 0; align-self: flex-start; }
  .tab {
    appearance: none;
    font: inherit;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--stroke);
    color: var(--muted);
    padding: 10px 20px;
    border-radius: 0;
    margin-right: -1px;
    transition: color .14s ease, background-color .14s ease;
  }
  .tab:hover { color: var(--ink-2); }
  .tab[aria-selected="true"] {
    background: var(--panel-2);
    color: var(--ink);
    border-color: var(--stroke-2);
    box-shadow: inset 0 -2px 0 var(--accent);
    position: relative;
    z-index: 1;
  }
  .tab .n { font-size: 9.5px; color: var(--muted); margin-left: 9px; }
  .tab[aria-selected="true"] .n { color: var(--accent); }

  #tab-board { display: flex; flex-direction: column; gap: 26px; }

  /* ---------- briefs ---------- */
  .briefs-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .briefs-head .eyebrow { margin: 0; }

  .briefs { display: flex; flex-direction: column; gap: 30px; }
  .brief-day { display: flex; flex-direction: column; gap: 0; }

  /* A ruled date divider, the way a drawing is annotated along a line. */
  .brief-day-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 10px;
  }
  .brief-day-head h2 {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0;
    white-space: nowrap;
  }
  .brief-day-head .rel {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .brief-day-head .rule { flex: 1; height: 1px; background: var(--stroke); min-width: 12px; }
  .brief-day-head .count {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .brief-day.soon .brief-day-head h2 { color: var(--accent); }
  .brief-day.past .brief-day-head h2 { color: var(--muted); }
  .brief-day.overdue .brief-day-head h2 { color: var(--critical); }
  .brief-day.overdue .brief-day-head .rel { color: var(--critical); }

  .past-briefs { margin-top: 34px; }
  .past-briefs > summary {
    display: flex;
    align-items: center;
    gap: 11px;
    cursor: pointer;
    padding: 13px 16px;
    border: 1px dashed var(--stroke-2);
    border-radius: 0;
    list-style: none;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .past-briefs > summary::-webkit-details-marker { display: none; }
  .past-briefs > summary::marker { content: ""; }
  .past-briefs > summary:hover { color: var(--accent); border-color: var(--accent); }
  .past-briefs > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .past-briefs .chev {
    width: 7px; height: 7px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
    transition: transform .18s ease;
    flex: none;
    margin-left: 2px;
  }
  .past-briefs[open] .chev { transform: rotate(-135deg); }
  .past-briefs .past-n { margin-left: auto; color: var(--muted); letter-spacing: .1em; }
  .past-briefs .briefs { margin-top: 26px; }
  .past-briefs[open] > summary { border-style: solid; background: var(--panel-2); }

  .briefs-empty {
    padding: 30px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    border: 1px dashed var(--stroke);
  }

  .brief { scroll-margin-top: 90px; padding: 0; overflow: hidden; }
  .brief + .brief { border-top: 0; }
  .brief-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px 11px;
    padding: 13px 18px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--stroke);
  }
  .brief-head h3 {
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    flex: 1 1 240px;
    min-width: 0;
    line-height: 1.32;
  }
  .brief-head h3 a { color: inherit; text-decoration: none; }
  .brief-head h3 a:hover { color: var(--accent); }
  .brief-tools { display: inline-flex; align-items: center; gap: 9px; flex: none; }
  @media (max-width: 560px) { .brief-head h3 { flex-basis: 100%; } }

  /* Sits next to a script wherever it is listed, so the brief is one hop
     away from the row rather than a tab away and a scroll down. */
  .briefjump {
    appearance: none;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    width: 24px; height: 24px;
    margin-left: 7px;
    padding: 0;
    border-radius: 0;
    background: var(--panel-3);
    border: 1px solid var(--stroke);
    color: var(--muted);
    cursor: pointer;
    transition: color .14s ease, border-color .14s ease;
  }
  .briefjump:hover { color: var(--accent); border-color: var(--accent); }
  .briefjump svg {
    width: 13px; height: 13px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  @media (pointer: coarse) { .briefjump { width: 32px; height: 32px; } }

  @keyframes brief-flash {
    from { box-shadow: inset 0 0 0 2px var(--accent); }
    to   { box-shadow: inset 0 0 0 2px transparent; }
  }
  .brief.flash { animation: brief-flash 1.7s ease-out; }

  .brief-copy {
    appearance: none;
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    padding: 0;
    border-radius: 0;
    background: var(--panel-3);
    border: 1px solid var(--stroke);
    color: var(--muted);
    cursor: pointer;
    transition: color .14s ease, border-color .14s ease;
  }
  .brief-copy:hover { color: var(--accent); border-color: var(--accent); }
  .brief-copy svg {
    width: 14px; height: 14px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .brief-copy.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 60%, transparent); }
  .brief-copy.failed { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 60%, transparent); }
  @media (pointer: coarse) { .brief-copy { width: 36px; height: 36px; } }

  /* Announced to a screen reader, since the only visible feedback is a
     colour and a glyph swap. */

    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* Verbatim, because the whole point is to see what the parser saw - so it
     wraps rather than truncating, and long briefs scroll inside the panel
     instead of pushing the next one off the screen. */
  .brief-body {
    margin: 0;
    padding: 16px 18px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.62;
    color: var(--ink-2);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    max-height: 440px;
    overflow-y: auto;
  }
  .brief-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 11px 18px 12px;
    border-top: 1px solid var(--stroke);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--muted);
  }
  /* The action sits opposite the parse notes, matching where the cards put
     it - at the bottom of the panel, not competing with the title. */
  .brief-action { margin-left: auto; }
  .brief-action .markerr { margin-top: 5px; }
  .brief-foot b { color: var(--ink-2); font-weight: 500; text-transform: uppercase; letter-spacing: .14em; }
