name: Script deadline reminders

# Twice a day: a morning look-ahead and an evening catch-all, in ET.
on:
  schedule:
    - cron: "0 13 * * *"   # 9am ET
    - cron: "0 23 * * *"   # 7pm ET
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Fetch threads and post the digest
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SCRIPTCHECK_WEBHOOK_URL: ${{ secrets.SCRIPTCHECK_WEBHOOK_URL }}
          SCRIPTCHECK_MY_USER_ID: ${{ secrets.SCRIPTCHECK_MY_USER_ID }}
        run: |
          python -m scriptcheck fetch -o data/threads.json
          python -m scriptcheck report -i data/threads.json
          python -m scriptcheck notify -i data/threads.json --only-if-action
